<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" stroke="#1e293b" stroke-width="8" />
  
  <!-- Subtle grid lines -->
  <line x1="96" y1="192" x2="416" y2="192" stroke="#1e293b" stroke-width="2" stroke-dasharray="6,6" opacity="0.6"/>
  <line x1="96" y1="320" x2="416" y2="320" stroke="#1e293b" stroke-width="2" stroke-dasharray="6,6" opacity="0.6"/>

  <!-- Candlesticks in background -->
  <line x1="160" y1="180" x2="160" y2="340" stroke="#10b981" stroke-width="4" opacity="0.4" />
  <rect x="152" y="220" width="16" height="80" rx="4" fill="#10b981" opacity="0.4" />

  <line x1="256" y1="130" x2="256" y2="370" stroke="#06b6d4" stroke-width="4" opacity="0.4" />
  <rect x="248" y="170" width="16" height="130" rx="4" fill="#06b6d4" opacity="0.4" />

  <line x1="352" y1="150" x2="352" y2="310" stroke="#6366f1" stroke-width="4" opacity="0.4" />
  <rect x="344" y="190" width="16" height="80" rx="4" fill="#6366f1" opacity="0.4" />

  <!-- Iconic 'M' Monogram with AI neural node terminals -->
  <path d="M 128 360 L 128 170 L 256 290 L 384 170 L 384 360" 
        fill="none" 
        stroke="url(#accent)" 
        stroke-width="32" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)" />

  <!-- Signal Node Spark at center -->
  <circle cx="256" cy="290" r="14" fill="#ffffff" filter="url(#glow)" />
  <circle cx="128" cy="170" r="10" fill="#10b981" />
  <circle cx="384" cy="170" r="10" fill="#6366f1" />
</svg>
